name: Build Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Valid Gradle Wrapper Files
        run: |
          mkdir -p gradle/wrapper
          # If gradle-wrapper.jar is missing, empty (0 bytes), or smaller than 10KB
          JAR_SIZE=$(stat -c%s "gradle/wrapper/gradle-wrapper.jar" 2>/dev/null || stat -f%z "gradle/wrapper/gradle-wrapper.jar" 2>/dev/null || echo 0)
          if [ "$JAR_SIZE" -lt 10000 ]; then
            echo "Restoring official Gradle 9.3.1 wrapper JAR from base64 backup or official source..."
            if [ -f "gradle/wrapper/gradle-wrapper.jar.base64" ]; then
              base64 -d gradle/wrapper/gradle-wrapper.jar.base64 > gradle/wrapper/gradle-wrapper.jar
            else
              curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar
            fi
          fi
          chmod +x gradlew || true
          ls -la gradle/wrapper/
          sha256sum gradle/wrapper/gradle-wrapper.jar

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false
          allow-checksum-mismatch: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Prepare Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from repository base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Creating standard debug.keystore fallback..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify Generated APK
        id: verify_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK not found in app/build/outputs/apk/debug/"
            exit 1
          fi
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          APK_NAME=$(basename "$APK_PATH")
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH ($APK_SIZE)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate Build Summary
        if: always()
        run: |
          echo "### 📱 Android APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "- **Durum:** ✅ Başarılı" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact Adı:** \`APK\`" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Dosyası:** \`${{ steps.verify_apk.outputs.apk_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Boyut:** \`${{ steps.verify_apk.outputs.apk_size }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Konum:** \`app/build/outputs/apk/debug/\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Gradle Sürümü:** 9.3.1" >> $GITHUB_STEP_SUMMARY
            echo "- **AGP Sürümü:** 9.1.1" >> $GITHUB_STEP_SUMMARY
            echo "- **JDK Sürümü:** Eclipse Temurin 17" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Durum:** ❌ Başarısız" >> $GITHUB_STEP_SUMMARY
            echo "Lütfen log çıktısındaki hata detaylarını kontrol edin." >> $GITHUB_STEP_SUMMARY
          fi
